# Lightweight validation on every push/PR (same checks the release runs)
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: python -m compileall -q __init__.py migration.py models routes services

      - name: Syntax-check JavaScript assets
        run: |
          for f in assets/*.js; do
            node --check "$f"
          done
